<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高德地图点位选择</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <script src="./secret.js"></script>
  <div class="app">
    <header class="toolbar">
      <div class="search-group">
        <input id="place-input" type="text" placeholder="搜索地名，例如：复旦大学" autocomplete="off">
        <button id="search-btn" type="button">搜索</button>
      </div>
      <div class="result" id="result-text">请点击地图或搜索地点</div>
    </header>
    <section class="content">
      <aside class="weather-panel" aria-label="天气信息">
        <div class="weather-current">
          <div class="weather-location" id="weather-location">请选择地点</div>
          <div class="weather-main-row">
            <div class="weather-temp" id="weather-temp">--℃</div>
            <div class="weather-status-wrap">
              <div class="weather-status" id="weather-status">--</div>
              <div class="weather-meta" id="weather-wind">风速：-- m/s</div>
              <div class="weather-meta" id="weather-humidity">湿度：--%</div>
            </div>
          </div>
          <div class="weather-update" id="weather-update">更新时间：--</div>
        </div>
        <div class="weather-forecast">
          <div class="forecast-title">未来5天天气预测</div>
          <canvas id="temp-chart" width="340" height="170" aria-label="最高最低温折线图"></canvas>
          <table class="forecast-table" aria-label="天气预测表格">
            <thead>
              <tr>
                <th>日期</th>
                <th>天气</th>
                <th>最低温</th>
                <th>最高温</th>
              </tr>
            </thead>
            <tbody id="forecast-body">
              <tr>
                <td colspan="4">请选择地点查看天气预测</td>
              </tr>
            </tbody>
          </table>
        </div>
      </aside>
      <main id="map-container" aria-label="高德地图"></main>
      <aside class="chat-panel" aria-label="AI 对话">
        <div class="chat-shell">
          <div class="history-rail" aria-label="会话操作">
            <button id="history-toggle-btn" class="rail-btn" type="button" aria-expanded="false" aria-controls="history-drawer">历史</button>
            <button id="new-chat-btn" class="rail-btn" type="button">新对话</button>
          </div>
          <aside class="history-drawer" id="history-drawer" aria-label="历史会话">
            <div class="history-title">历史会话</div>
            <div class="history-list" id="history-list"></div>
            <div class="history-empty" id="history-empty">暂无历史记录</div>
          </aside>
          <div class="chat-main">
            <div class="chat-header">AI 天气助手</div>
            <details class="context-panel" id="context-panel">
              <summary>地图选点信息</summary>
              <pre id="context-content">{
  "位置": {
    "城市": "--",
    "行政区": "--"
  },
  "当前天气": "暂无",
  "天气预报": []
}</pre>
            </details>
            <div class="chat-messages" id="chat-messages" aria-label="对话消息"></div>
            <div class="chat-input-wrap">
              <textarea id="chat-input" placeholder="可以询问：今天适合出门吗？未来几天温差大吗？"></textarea>
              <button id="chat-send-btn" type="button">发送</button>
            </div>
          </div>
        </div>
      </aside>
    </section>
  </div>

  <script>
    window._AMapSecurityConfig = {
      securityJsCode: YourSecurityJsCode
    };
    window.AMAP_KEYS = {
      jsKey: YourJsKey,
      webServiceKey: YourWebServiceKey
    };
    window.GLM_CONFIG = {
      key: YourKeyKey,
      secret: YourSecret
    };
  </script>
  <script src="https://webapi.amap.com/loader.js"></script>
  <script src="./script.js"></script>
</body>
</html>
